<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InCubeAte · Glass map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: the map fills the window; glass panels float over it (summary left, selected city right). One dark look, by choice. */
  :root {
    color-scheme: light;
    --ground: #eef2f6; --ink: #13213a; --muted: #4d5b70; --faint: #7a8698;
    --glass: rgba(255, 255, 255, 0.58); --glass-strong: rgba(255, 255, 255, 0.82); --edge: rgba(19, 33, 58, 0.10); --edge-hi: rgba(255, 255, 255, 0.9);
    --teal: #1f5fbf; --amber: #c08417; --coral: #c23b3b;
    --tint: rgba(19, 33, 58, 0.045); --tint-2: rgba(19, 33, 58, 0.08); --track: rgba(19, 33, 58, 0.09); --bar: rgba(19, 33, 58, 0.22);
    --font: "Manrope", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }
  /* Colour fields behind the glass, so the blur has something to refract. */
  .field { position: fixed; inset: 0; pointer-events: none; }
  .field i { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .5; }
  .field i:nth-child(1) { width: 46vw; height: 46vw; left: -8vw; top: -12vw; background: #c9dcf5; }
  .field i:nth-child(2) { width: 38vw; height: 38vw; right: -6vw; bottom: -14vw; background: #e6dccb; opacity: .55; }
  .field i:nth-child(3) { width: 30vw; height: 30vw; left: 38vw; top: 30vh; background: #d3e6ea; opacity: .55; }
  canvas#dots { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* Glass: translucent fill, blur, a bright top edge where light catches it; the shadow is driven by the cursor. */
  .glass { background: var(--glass); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); border: 1px solid var(--edge); border-top-color: var(--edge-hi); border-radius: 22px; box-shadow: var(--sx, 0px) var(--sy, 18px) var(--sb, 44px) rgba(19, 33, 58, var(--sa, .12)), inset 0 1px 0 rgba(255, 255, 255, .7); }
  header.glass { position: fixed; top: 16px; left: 16px; right: 16px; height: 60px; display: flex; align-items: center; gap: 18px; padding: 0 18px; border-radius: 18px; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .kpis { display: flex; gap: 26px; margin-left: 24px; }
  .kpis div span { display: block; font-size: 12px; color: var(--faint); }
  .kpis div b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hint { margin-left: auto; color: var(--muted); font-size: 13px; }
  aside.glass { position: fixed; top: 92px; bottom: 16px; width: 340px; padding: 18px; overflow-y: auto; z-index: 4; }
  #left { left: 16px; }
  #right { right: 16px; width: 380px; bottom: auto; max-height: calc(100vh - 108px); }
  h1 { font-size: 20px; letter-spacing: -0.015em; margin: 0 0 4px; font-weight: 700; }
  h2 { font-size: 15px; margin: 18px 0 10px; font-weight: 600; }
  .finding { color: var(--muted); margin: 0 0 14px; }
  .finding b { color: var(--coral); font-weight: 600; }
  .ringrow { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 16px; background: var(--tint); }
  .ringrow .k { display: grid; gap: 4px; }
  .ringrow .k div { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
  .ringrow .k i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .ringrow .k b { color: var(--ink); font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 10px; }
  ul.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .queue li { padding: 10px 12px; border-radius: 14px; background: var(--tint); border: 1px solid var(--tint-2); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; cursor: default; transition: background 160ms; }
  .queue li:hover { background: var(--tint-2); }
  .queue .who { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue .why { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; align-self: start; }
  .tag.fraud { background: #fbe4e2; color: #8f2424; }
  .tag.review { background: #fbf0d9; color: #7a5209; }
  .tag.hold { background: var(--tint-2); color: var(--ink); }
  /* City markers */
  .city { position: fixed; z-index: 3; transform: translate(-50%, -50%); border: 0; padding: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .city:focus-visible .orb { outline: 3px solid var(--teal); outline-offset: 4px; }
  .orb { width: calc(var(--sz) * var(--k, 1)); height: calc(var(--sz) * var(--k, 1)); }
  .orb { position: relative; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, .72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--edge); transform: scale(var(--s, 1)); box-shadow: 0 var(--lift, 6px) calc(var(--lift, 6px) * 3) rgba(19, 33, 58, .16); }
  .orb svg { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); }
  .orb b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .city .label { position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 4px 10px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--edge); font-size: 12.5px; font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .city .label span { color: var(--muted); font-weight: 500; }
  .city.above .label { top: auto; bottom: calc(100% + 12px); }
  .city[aria-pressed="true"] .orb { border: 2px solid var(--teal); }
  .city.open .orb::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 1.5px dashed var(--coral); }
  .terrcard { padding: 14px; border-radius: 16px; background: var(--tint); border: 1px solid var(--tint-2); margin-bottom: 10px; }
  .terrcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .terrcard h3 { margin: 0; font-size: 15px; }
  .terrcard .pr { color: var(--muted); font-size: 12.5px; }
  .slots { display: flex; gap: 6px; margin: 10px 0; }
  .slot { width: 22px; height: 22px; border-radius: 6px; border: 1.5px dashed var(--faint); }
  .slot.won { background: var(--teal); border: 0; }
  .slot.held { background: var(--amber); border: 0; }
  .bars { display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: 64px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 12.5px; }
  .bar .t { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar .t i { display: block; height: 100%; border-radius: 4px; background: var(--bar); }
  .bar.won .t i { background: var(--teal); }
  .bar span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty-note { color: var(--coral); font-weight: 600; margin: 6px 0 0; font-size: 13px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; color: var(--faint); }
  .tip { position: fixed; z-index: 6; pointer-events: none; padding: 10px 12px; border-radius: 14px; font-size: 12.5px; opacity: 0; transform: translateY(4px); transition: opacity 120ms, transform 120ms; }
  .tip.on { opacity: 1; transform: none; }
  .rise { animation: rise 700ms cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { from { transform: translateY(14px); } to { transform: none; } }
  @media (max-width: 1100px) { #left { width: 300px; } #right { width: 330px; } .kpis { display: none; } }
  @media (max-width: 860px) {
    .orb { --k: .72; } .orb b { font-size: 13px; } .city .label { font-size: 11.5px; padding: 3px 8px; top: calc(100% + 8px); } .city.above .label { bottom: calc(100% + 8px); }
    body { overflow: auto; }
    header.glass { position: sticky; top: 0; left: 0; right: 0; margin: 12px; border-radius: 16px; }
    .hint { display: none; }
    #mapzone { position: relative; height: 62vh; }
    aside.glass { position: static; width: auto !important; margin: 12px; max-height: none; }
    canvas#dots, .field { position: fixed; }
  }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; } .tip { transition: none; } }
  @media (prefers-reduced-transparency: reduce) { .glass, .orb, .city .label { backdrop-filter: none; -webkit-backdrop-filter: none; background: #ffffff; } }
</style>
</head>
<body>
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="dots" aria-hidden="true"></canvas>
<header class="glass rise">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 19 6.5v9L11 20 3 15.5v-9z" fill="none" stroke="#13213a" stroke-width="1.6"/><path d="M11 11 19 6.5M11 11 3 6.5M11 11v9" stroke="#13213a" stroke-width="1.6"/><path d="M11 11 19 6.5v9L11 20z" fill="#1f5fbf"/></svg>InCubeAte</div>
  <div class="kpis" id="kpis"></div>
  <div class="hint">Move over the map; click a city for its territories</div>
</header>
<div id="mapzone"></div>
<aside class="glass rise" id="left" style="animation-delay:80ms" aria-label="Summary"></aside>
<aside class="glass rise" id="right" style="animation-delay:160ms" aria-label="Selected city" aria-live="polite"></aside>
<div class="glass tip" id="tip" role="status"></div>

<script type="module">
  import { load } from '../data.js';
  const D = await load();
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Approximate city centres (degrees). Good enough for a schematic; not survey-grade.
  const GEO = { 'Bengaluru': [12.97, 77.59], 'Mysuru': [12.30, 76.64], 'Mangaluru': [12.91, 74.86], 'Hubballi-Dharwad': [15.36, 75.12], 'Belagavi': [15.85, 74.50], 'Tumakuru': [13.34, 77.10], 'Davanagere': [14.46, 75.92] };
  const decisions = Object.values(D.decisions);
  const cities = Object.keys(GEO).map((name) => {
    const terr = D.territories.filter((t) => t.city === name);
    const apps = decisions.filter((d) => (d.app.city || d.app.cityRaw) === name);
    const slots = terr.reduce((s, t) => s + t.slots, 0), filled = terr.reduce((s, t) => s + t.approved + t.pending, 0);
    return { name, lat: GEO[name][0], lon: GEO[name][1], terr, apps: apps.length, slots, filled, approved: terr.reduce((s, t) => s + t.approved, 0),
      stores: D.storeList.filter((s) => s.city === name).length, open: slots > filled, queue: D.queue.filter((q) => q.city === name).length };
  });
  console.assert(cities.reduce((s, c) => s + c.filled, 0) === D.filled, 'city slots add up');

  // KPIs
  const empty = D.territories.filter((t) => t.slots > t.approved + t.pending);
  $('kpis').innerHTML = [['Slots with a partner', `${D.filled} / ${D.slots}`], ['Applications', D.total], ['Need a person', D.queue.length], ['Approved', D.counts['Approved']]]
    .map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join('');

  // Left panel
  const ring = (size, st, parts, centre) => { const r = (size - st) / 2, c = 2 * Math.PI * r; let off = 0; return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${parts.map((p) => p.label + ' ' + p.n).join(', ')}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(19,33,58,.09)" stroke-width="${st}"/>${parts.map((p) => { const len = c * p.frac; const s = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${p.col}" stroke-width="${st}" stroke-dasharray="${Math.max(0, len - 2.5)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})" stroke-linecap="round"/>`; off += len; return s; }).join('')}${centre || ''}</svg>`; };
  const held = D.filled - D.counts['Approved'];
  const tagOf = (q) => q.fraud ? ['Possible fraud', 'fraud'] : q.status === 'Brand review' ? ['Brand review', 'review'] : q.status === 'On hold' ? ['On hold', 'hold'] : ['Flagged', 'review'];
  $('left').innerHTML = `
    <h1>Karnataka expansion</h1>
    <p class="finding">${D.filled} of ${D.slots} slots have a partner. <b>${empty.map((t) => `${t.id} ${t.city}`).join(', ')}</b> is still open: none of its ${empty[0]?.applicants ?? 0} applicants can take it yet.</p>
    <div class="ringrow">${ring(104, 12, [{ label: 'Approved', n: D.counts['Approved'], frac: D.counts['Approved'] / D.slots, col: 'var(--teal)' }, { label: 'Held for review', n: held, frac: held / D.slots, col: 'var(--amber)' }],
      `<text x="52" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="#13213a" font-family="Manrope, sans-serif">${D.filled}</text><text x="52" y="72" text-anchor="middle" font-size="11" fill="#5b6879" font-family="Manrope, sans-serif">of ${D.slots} slots</text>`)}
      <div class="k"><div><i style="background:var(--teal)"></i>Approved<b>${D.counts['Approved']}</b></div><div><i style="background:var(--amber)"></i>Held for review<b>${held}</b></div><div><i style="border:1.5px dashed var(--faint);width:7px;height:7px"></i>Open<b>${D.slots - D.filled}</b></div></div></div>
    <h2>Needs a person · ${D.queue.length}</h2>
    <ul class="queue">${D.queue.slice(0, 6).map((q) => { const [t, c] = tagOf(q); return `<li data-city="${esc(q.city)}"><span class="who">${esc(q.name)}</span><span class="tag ${c}">${t}</span><span class="why">${q.id} · ${esc(q.why)}</span></li>`; }).join('')}</ul>
    <p class="small" style="margin-top:12px">Showing 6 of ${D.queue.length}. Hover a row to find its city on the map.</p>`;

  // Right panel: the selected city
  let selected = 'Bengaluru';
  function renderRight() {
    const c = cities.find((x) => x.name === selected);
    $('right').innerHTML = `
      <h1>${esc(c.name)}</h1>
      <p class="muted" style="margin:0 0 6px">${c.apps} applications · ${c.stores} existing store${c.stores === 1 ? '' : 's'} · ${c.terr.length ? `${c.filled} of ${c.slots} slots filled` : 'no territory'}</p>
      ${c.terr.length ? c.terr.map((t) => {
        const comp = decisions.filter((d) => d.territory === t.id && d.score).sort((a, b) => a.rank - b.rank);
        const won = new Set(t.winners.map((w) => w.id));
        return `<div class="terrcard"><div class="top"><h3>${t.id}</h3><span class="pr">${t.priority} priority · ${t.applicants} applied</span></div>
          <div class="slots" aria-label="${t.approved} approved, ${t.pending} held, ${t.slots - t.approved - t.pending} open">${[...Array(t.slots)].map((_, k) => `<span class="slot ${k < t.approved ? 'won' : k < t.approved + t.pending ? 'held' : ''}"></span>`).join('') || '<span class="small">No open slots here now</span>'}</div>
          ${comp.length ? `<div class="bars">${comp.map((d) => `<div class="bar ${won.has(d.id) ? 'won' : ''}"><span class="num">${d.id}</span><span class="t"><i style="width:${d.score.total}%"></i></span><span>${d.score.total.toFixed(0)}</span></div>`).join('')}</div>` : (t.slots ? '<p class="empty-note">Open slot, nobody eligible yet</p>' : '')}
        </div>`;
      }).join('') : '<p class="empty-note">No territory covers this city yet; applicants here are waitlisted.</p>'}
      <p class="small">Blue holds a slot; bars are scores out of 100. City positions are approximate.</p>`;
    document.querySelectorAll('.city').forEach((b) => b.setAttribute('aria-pressed', b.dataset.city === selected));
  }

  // ---- Map geometry: the city markers sit in the free space between the panels ----
  const zone = () => {
    if (innerWidth <= 860) { const r = $('mapzone').getBoundingClientRect(); return { x0: r.left + 40, x1: r.right - 40, y0: r.top + 50, y1: r.bottom - 60 }; }
    const L = $('left').getBoundingClientRect(), R = $('right').getBoundingClientRect();
    return { x0: L.right + 70, x1: R.left - 70, y0: 140, y1: innerHeight - 90 };
  };
  const LON = [74.3, 77.8], LAT = [12.1, 16.1];
  function place() {
    const z = zone();
    // Keep the map's aspect: fit lon/lat (with cos(lat) correction) into the zone.
    const kx = Math.cos(14 * Math.PI / 180), w = (LON[1] - LON[0]) * kx, h = LAT[1] - LAT[0];
    const s = Math.min((z.x1 - z.x0) / w, (z.y1 - z.y0) / h), ox = z.x0 + ((z.x1 - z.x0) - w * s) / 2, oy = z.y0 + ((z.y1 - z.y0) - h * s) / 2;
    for (const c of cities) { c.x = ox + (c.lon - LON[0]) * kx * s; c.y = oy + (LAT[1] - c.lat) * s; }
    document.querySelectorAll('.city').forEach((b) => { const c = cities.find((x) => x.name === b.dataset.city); b.style.left = `${c.x}px`; b.style.top = `${c.y}px`; });
  }
  document.body.insertAdjacentHTML('beforeend', cities.map((c) => {
    const size = 34 + Math.sqrt(c.apps) * 9;
    const parts = c.slots ? [{ label: 'Approved', n: c.approved, frac: c.approved / c.slots, col: 'var(--teal)' }, { label: 'Held', n: c.filled - c.approved, frac: (c.filled - c.approved) / c.slots, col: 'var(--amber)' }] : [];
    const r = size / 2 + 3, circ = 2 * Math.PI * r; let off = 0;
    const arcs = parts.map((p) => { const len = circ * p.frac; const s = `<circle cx="${size / 2 + 7}" cy="${size / 2 + 7}" r="${r}" fill="none" stroke="${p.col}" stroke-width="3" stroke-dasharray="${Math.max(0, len - 2)} ${circ}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2 + 7} ${size / 2 + 7})" stroke-linecap="round"/>`; off += len; return s; }).join('');
    return `<button class="city ${c.open ? 'open' : ''} ${['Tumakuru', 'Belagavi'].includes(c.name) ? 'above' : ''}" data-city="${esc(c.name)}" aria-label="${esc(c.name)}: ${c.apps} applications, ${c.slots ? `${c.filled} of ${c.slots} slots filled` : 'no open slots'}"><span class="orb" style="--sz:${size}px"><svg viewBox="0 0 ${size + 14} ${size + 14}" aria-hidden="true">${arcs}</svg><b>${c.apps}</b></span><span class="label">${esc(c.name.replace('Hubballi-Dharwad', 'Hubballi'))} <span>${c.slots ? `${c.filled}/${c.slots}` : '0 slots'}</span></span></button>`;
  }).join(''));

  // ---- Dot field and proximity ----
  const cv = $('dots'), ctx = cv.getContext('2d');
  let dots = [], W = 0, H = 0, dpr = 1;
  const mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999 };
  const probe = new URLSearchParams(location.search).get('probe'); // e.g. ?probe=640,420 pins the cursor for screenshots
  if (probe) { const [x, y] = probe.split(',').map(Number); Object.assign(mouse, { x, y, tx: x, ty: y }); }
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = []; const gap = W < 600 ? 18 : 22;
    for (let y = gap / 2; y < H; y += gap) for (let x = gap / 2; x < W; x += gap) dots.push({ x, y });
    place();
  }
  const near = (x, y, sigma) => Math.exp(-((x - mouse.x) ** 2 + (y - mouse.y) ** 2) / (2 * sigma * sigma));
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const d of dots) {
      // Cities light the dots around them a little; the cursor lights them a lot.
      let city = 0; for (const c of cities) city = Math.max(city, Math.exp(-((d.x - c.x) ** 2 + (d.y - c.y) ** 2) / (2 * 60 * 60)));
      const m = near(d.x, d.y, 90);
      const dx = d.x - mouse.x, dy = d.y - mouse.y, dist = Math.hypot(dx, dy) || 1;
      const push = m * 6; // dots lean away from the cursor
      const r = 1 + city * 0.8 + m * 1.8;
      const a = 0.12 + city * 0.22 + m * 0.5;
      ctx.fillStyle = m > city ? `rgba(31, 95, 191, ${a})` : `rgba(80, 98, 122, ${a * 0.8})`;
      ctx.beginPath(); ctx.arc(d.x + (dx / dist) * push, d.y + (dy / dist) * push, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- Cursor-lit shadows and lifting markers ----
  const glass = [...document.querySelectorAll('.glass:not(.tip)')];
  function light() {
    for (const el of glass) {
      const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      // Light comes from the cursor, so the shadow falls on the far side and grows as the cursor nears.
      const vx = cx - mouse.x, vy = cy - mouse.y, d = Math.hypot(vx, vy) || 1, k = Math.min(1, 420 / d);
      const has = mouse.x > -999;
      el.style.setProperty('--sx', `${has ? (vx / d) * 14 * k : 0}px`);
      el.style.setProperty('--sy', `${has ? (vy / d) * 14 * k + 10 : 18}px`);
      el.style.setProperty('--sb', `${has ? 40 + 30 * k : 44}px`);
      el.style.setProperty('--sa', `${has ? 0.1 + 0.08 * k : 0.12}`);
    }
    document.querySelectorAll('.city').forEach((b) => {
      const c = cities.find((x) => x.name === b.dataset.city);
      const p = near(c.x, c.y, 110);
      const orb = b.querySelector('.orb');
      orb.style.setProperty('--s', String(1 + p * 0.18 + (b.dataset.city === selected ? 0.06 : 0)));
      orb.style.setProperty('--lift', `${6 + p * 16}px`);
    });
  }
  function frame() {
    // Ease the light toward the cursor so shadows glide rather than jump.
    mouse.x += (mouse.tx - mouse.x) * 0.22; mouse.y += (mouse.ty - mouse.y) * 0.22;
    draw(); light();
    if (!reduced) requestAnimationFrame(frame);
  }
  addEventListener('pointermove', (e) => { mouse.tx = e.clientX; mouse.ty = e.clientY; if (mouse.x < -999) { mouse.x = mouse.tx; mouse.y = mouse.ty; } if (reduced) { mouse.x = mouse.tx; mouse.y = mouse.ty; draw(); light(); } });
  addEventListener('pointerleave', () => { mouse.tx = mouse.ty = -9999; });
  document.addEventListener('mouseleave', () => { mouse.tx = mouse.ty = -9999; mouse.x = mouse.y = -9999; });

  // Tooltip and selection
  const tip = $('tip');
  document.addEventListener('pointerover', (e) => {
    const b = e.target.closest('.city'); if (!b) return;
    const c = cities.find((x) => x.name === b.dataset.city);
    tip.innerHTML = `<b>${esc(c.name)}</b><br>${c.apps} applications · ${c.queue} need a person<br>${c.slots ? `${c.filled} of ${c.slots} slots filled` : 'No open slots'} · ${c.stores} store${c.stores === 1 ? '' : 's'}`;
    tip.style.left = `${c.x + 46}px`; tip.style.top = `${c.y - 40}px`; tip.classList.add('on');
  });
  document.addEventListener('pointerout', (e) => { if (e.target.closest('.city') && !e.relatedTarget?.closest?.('.city')) tip.classList.remove('on'); });
  document.addEventListener('click', (e) => { const b = e.target.closest('.city'); if (b) { selected = b.dataset.city; renderRight(); light(); } });
  // Hovering a queue row points the light at its city.
  $('left').addEventListener('pointerover', (e) => { const li = e.target.closest('li[data-city]'); if (!li) return; const c = cities.find((x) => x.name === li.dataset.city); if (c) { mouse.tx = c.x; mouse.ty = c.y; } });

  addEventListener('resize', () => { resize(); draw(); light(); });
  addEventListener('scroll', () => { place(); draw(); light(); }, { passive: true });
  renderRight(); resize(); draw(); light();
  if (!reduced) requestAnimationFrame(frame);
</script>
</body>
</html>
